name: Acceptance Tests
run-name: Acceptance ${{ github.event.client_payload.application_ref || inputs.target_commit || github.sha }}

on:
  workflow_call:
    inputs:
      user_url:
        required: true
        type: string
      municipality_url:
        required: true
        type: string
      evidence_mode:
        required: false
        default: false
        type: boolean
      target_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      user_url:
        description: Public user deployment URL reachable from the GitHub Actions runner
        required: false
        type: string
      municipality_url:
        description: Public municipality deployment root URL reachable from the GitHub Actions runner
        required: false
        type: string
      base_url:
        description: Legacy single-application URL; use user_url and municipality_url for split deployments
        required: false
        type: string
      evidence_mode:
        description: Run mobile/admin evidence journeys and upload the full evidence bundle
        required: true
        default: false
        type: boolean
      target_commit:
        description: Exact 40-character application commit SHA under test
        required: true
        type: string
  repository_dispatch:
    types: [application-updated]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Normalize dispatch targets
    runs-on: ubuntu-latest
    outputs:
      user_url: ${{ steps.normalize.outputs.user_url }}
      municipality_url: ${{ steps.normalize.outputs.municipality_url }}
      evidence_mode: ${{ steps.normalize.outputs.evidence_mode }}
      target_commit: ${{ steps.normalize.outputs.target_commit }}
    steps:
      - name: Resolve workflow inputs and dispatch payload
        id: normalize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_USER_URL: ${{ inputs.user_url }}
          INPUT_MUNICIPALITY_URL: ${{ inputs.municipality_url }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
          INPUT_EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          INPUT_TARGET_COMMIT: ${{ inputs.target_commit }}
          PAYLOAD_USER_URL: ${{ github.event.client_payload.user_url }}
          PAYLOAD_MUNICIPALITY_URL: ${{ github.event.client_payload.municipality_url }}
          PAYLOAD_EVIDENCE_MODE: ${{ github.event.client_payload.evidence_mode }}
          PAYLOAD_APPLICATION_REF: ${{ github.event.client_payload.application_ref }}
          PAYLOAD_TARGET_COMMIT: ${{ github.event.client_payload.target_commit }}
          PAYLOAD_URL: ${{ github.event.client_payload.url }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          GITHUB_RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            user_url="${PAYLOAD_USER_URL:-$PAYLOAD_URL}"
            municipality_url="$PAYLOAD_MUNICIPALITY_URL"
            if [[ -z "$municipality_url" && -n "$PAYLOAD_URL" ]]; then
              municipality_url="${PAYLOAD_URL%/}/crisis"
            fi
            evidence_mode="${PAYLOAD_EVIDENCE_MODE:-false}"
            target_commit="${PAYLOAD_APPLICATION_REF:-${PAYLOAD_TARGET_COMMIT:-$PAYLOAD_REF}}"
          else
            user_url="${INPUT_USER_URL:-$INPUT_BASE_URL}"
            municipality_url="$INPUT_MUNICIPALITY_URL"
            if [[ -z "$municipality_url" && -n "$INPUT_BASE_URL" ]]; then
              municipality_url="${INPUT_BASE_URL%/}/crisis"
            fi
            evidence_mode="${INPUT_EVIDENCE_MODE:-false}"
            target_commit="${INPUT_TARGET_COMMIT:-$GITHUB_RUN_SHA}"
          fi

          evidence_mode="${evidence_mode,,}"

          [[ -n "$user_url" ]] || { echo "user_url is required" >&2; exit 1; }
          [[ -n "$municipality_url" ]] || { echo "municipality_url is required" >&2; exit 1; }
          [[ "$user_url" =~ ^https?://[^[:space:]]+$ ]] || { echo "user_url must be an HTTP(S) URL" >&2; exit 1; }
          [[ "$municipality_url" =~ ^https?://[^[:space:]]+$ ]] || { echo "municipality_url must be an HTTP(S) URL" >&2; exit 1; }
          [[ "$evidence_mode" == "true" || "$evidence_mode" == "false" ]] || {
            echo "evidence_mode must be true or false" >&2
            exit 1
          }
          [[ "$target_commit" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "target_commit/application_ref must be the exact 40-character application SHA" >&2
            exit 1
          }

          {
            echo "user_url=$user_url"
            echo "municipality_url=$municipality_url"
            echo "evidence_mode=$evidence_mode"
            echo "target_commit=$target_commit"
          } >> "$GITHUB_OUTPUT"

  functional:
    name: Release acceptance
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ needs.prepare.outputs.user_url }}
      MUNICIPALITY_URL: ${{ needs.prepare.outputs.municipality_url }}
      TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}

    steps:
      - name: Check out acceptance repository
        uses: actions/checkout@v4
        with:
          repository: kuraryu405/StayBridgeTokyo-e2e
          # A called workflow keeps the caller's event name and ref. Use this
          # repository's main branch for calls, while preserving direct branch runs.
          ref: ${{ github.repository == 'kuraryu405/StayBridgeTokyo-e2e' && github.ref || 'main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check
        run: pnpm typecheck

      - name: Run release acceptance tests
        run: pnpm test:release

      - name: Upload functional report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staybridge-release-${{ needs.prepare.outputs.target_commit }}
          path: |
            evidence/reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  evidence:
    name: Evidence acceptance
    needs: [prepare, functional]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.evidence_mode == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ needs.prepare.outputs.user_url }}
      MUNICIPALITY_URL: ${{ needs.prepare.outputs.municipality_url }}
      TARGET_COMMIT: ${{ needs.prepare.outputs.target_commit }}

    steps:
      - name: Check out acceptance repository
        uses: actions/checkout@v4
        with:
          repository: kuraryu405/StayBridgeTokyo-e2e
          # Keep evidence execution on the same acceptance source as functional.
          ref: ${{ github.repository == 'kuraryu405/StayBridgeTokyo-e2e' && github.ref || 'main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run evidence journeys
        run: pnpm test:evidence

      - name: Generate evidence matrix
        if: always()
        run: pnpm evidence:matrix

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staybridge-acceptance-evidence-${{ needs.prepare.outputs.target_commit }}
          path: |
            evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
